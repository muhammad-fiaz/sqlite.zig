name: Feature Request
description: Suggest a new feature for sqlite.zig
labels: ["enhancement"]
body:
  - type: textarea
    id: description
    attributes:
      label: Feature Description
      description: What would you like to see added?
      placeholder: A clear description of the feature.
    validations:
      required: true
  - type: textarea
    id: use-case
    attributes:
      label: Use Case
      description: Why is this needed? What problem does it solve?
      placeholder: Describe the use case and why it matters.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any workarounds or alternative approaches?
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of sqlite.zig does this affect?
      options:
        - Core Engine (storage, btree, pager)
        - SQL Parser & Lexer
        - DSL Query Builder
        - Connection & Transactions
        - Migrations
        - Documentation
        - Testing
        - Other
    validations:
      required: true
  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any examples, references, or mockups.
